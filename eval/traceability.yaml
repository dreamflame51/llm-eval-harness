# What this harness claims to check, what checks it, and where the evidence is.
#
# What each requirement is *for* lives in eval/needs.yaml, which names the
# requirements that serve each user need. The link is checked in both
# directions by tests/eval/test_traceability.py.
#
# The point of writing it down is that the three columns drift apart otherwise:
# a requirement that nothing verifies, a test whose requirement nobody
# remembers, a number quoted from a file that no longer exists. Every `tests`
# entry here is checked against the real collected test list and every
# `evidence` path against the filesystem by tests/eval/test_traceability.py, so
# a matrix that has rotted fails the suite rather than sitting in a document
# looking official.
#
# Requirements are written as claims about the system under test, not as
# descriptions of the code that checks them. "Declines when the corpus cannot
# answer" is a requirement; "refusal.py has a phrase list" is not.
#
# `measured` says how the requirement is held: a gate fails the build, a
# measurement is reported and read by a person. Most of these are measurements
# on purpose - no acceptance threshold has been agreed for any metric here,
# and a threshold invented to make a dashboard green is worse than none.

- id: REQ-01
  requirement: >-
    Every gold quote in the reference set appears verbatim in the text
    extracted from the corpus, so a metric measures retrieval and not the PDF
    extractor.
  measured: gate
  tests:
    - tests/eval/test_ground_truth.py::test_no_gold_context_is_absent_from_the_extracted_text
    - tests/eval/test_dataset.py::test_answerable_records_have_contexts
  checks:
    - python -m llm_eval_harness.validate
  evidence:
    - eval/ground_truth.yaml
  lesson: docs/lessons.md#1

- id: REQ-02
  requirement: >-
    A gold span that no single chunk holds whole is still reachable, and the
    ceiling of each retrieval metric is known, so a low score is not read as a
    bad retriever when it is a low ceiling.
  measured: measurement
  tests:
    - tests/eval/test_evaluator.py::test_a_span_split_across_two_chunks_is_fully_covered
    - tests/eval/test_evaluator.py::test_a_context_split_across_two_chunks_is_a_miss
    - tests/eval/test_ground_truth.py::test_split_contexts_match_the_known_baseline
  checks:
    - python -m llm_eval_harness.evaluator
    - python scripts/sweep.py
  evidence:
    - eval/ground_truth.yaml
  lesson: docs/lessons.md#14

- id: REQ-03
  requirement: >-
    Retrieval serves the supporting text for an answerable question. Where it
    does not, the generator is given nothing to answer from and no
    generation-side metric can be read as a property of the model.
  measured: measurement
  tests:
    - tests/rag/test_lexical.py::test_the_chunk_containing_the_term_ranks_first
    - tests/rag/test_lexical.py::test_an_identifier_stays_one_token
    - tests/rag/test_lexical.py::test_a_chunk_both_rankings_like_beats_one_only_the_first_ranks_first
  checks:
    - python scripts/compare_retrievers.py
  evidence:
    - eval/answerable_answers.yaml
  lesson: docs/lessons.md#23

- id: REQ-04
  requirement: >-
    The system declines when the corpus cannot answer the question, and an
    answer that declines and then answers anyway does not count as declining.
  measured: measurement
  tests:
    - tests/eval/test_judge.py::test_declining_and_then_answering_is_not_a_refusal
    - tests/eval/test_refusal.py::test_a_hedge_shows_up_as_a_disagreement
    - tests/eval/test_regression.py::test_the_refusal_headline_has_not_moved
  checks:
    - python -m llm_eval_harness.refusal
  evidence:
    - eval/refusal_answers.yaml
    - eval/judge_cache
  lesson: docs/lessons.md#12

- id: REQ-05
  requirement: >-
    The system asserts nothing the retrieved chunks do not support. Judged
    against those chunks only, never against what is true of the standard.
  measured: measurement
  tests:
    - tests/eval/test_judge.py::test_the_fabricated_prompt_shows_the_chunks
    - tests/eval/test_judge.py::test_the_fabricated_decision_is_the_flag
    - tests/eval/test_refusal.py::test_clean_needs_both_halves
  checks:
    - python scripts/calibrate_judge.py --model qwen3:8b
    - python scripts/ragas_eval.py
  evidence:
    - eval/judge_cache
    - eval/ragas_scores.json
    - eval/deepeval_scores.json
  lesson: docs/lessons.md#20

- id: REQ-06
  requirement: >-
    No detector decides a reported number until its agreement with hand labels
    has been measured - including the cheap detector it was meant to replace.
  measured: gate
  tests:
    - tests/eval/test_dataset.py::test_hand_labels_are_present_as_keys_even_when_unfilled
    - tests/eval/test_judge_report.py::test_each_axis_is_paired_with_its_own_column
    - tests/eval/test_regression.py::test_the_pinned_judge_is_the_one_being_read
  checks:
    - python scripts/judge_report.py
  evidence:
    - eval/refusal_answers.yaml
    - eval/expected_metrics.json
  lesson: docs/lessons.md#18

- id: REQ-07
  requirement: >-
    Every reported number can be recomputed with no model installed, by
    someone who has only the repository.
  measured: gate
  tests:
    - tests/eval/test_regression.py::test_the_refusal_headline_has_not_moved
    - tests/eval/test_regression.py::test_library_scores_have_not_moved[ragas]
  checks:
    - python -m llm_eval_harness.refusal
    - python scripts/compare_evals.py
  evidence:
    - eval/judge_cache
    - eval/ragas_scores.json
    - eval/deepeval_scores.json
    - .github/workflows/ci.yml
  lesson: docs/lessons.md#17

- id: REQ-08
  requirement: >-
    A change to the judge's prompt cannot leave the report quoting verdicts
    written for the previous one.
  measured: gate
  tests:
    - tests/eval/test_judge.py::test_editing_the_prompt_makes_every_verdict_stale
    - tests/eval/test_judge.py::test_the_prompt_version_is_in_the_key
    - tests/eval/test_regression.py::test_every_record_has_a_verdict_at_the_current_prompt_version
  checks:
    - python scripts/judge_refusals.py --model qwen3:8b
  evidence:
    - eval/judge_cache
    - eval/expected_metrics.json
  lesson: docs/lessons.md#18

- id: REQ-09
  requirement: >-
    The generator's drift between processes cannot silently invalidate a hand
    label or a cached verdict: what was judged is frozen, and a label travels
    to a new recording only when the text it describes is unchanged.
  measured: gate
  tests:
    - tests/eval/test_record_answers.py::test_an_identical_answer_keeps_its_labels
    - tests/eval/test_record_answers.py::test_a_changed_answer_does_not
    - tests/eval/test_label_refusals.py::test_the_frozen_text_is_not_reformatted
  checks:
    - python scripts/record_answers.py --set refusal --out eval/refusal_answers.next.yaml
  evidence:
    - eval/refusal_answers.yaml
    - eval/dense_baseline/refusal_answers.yaml
    - eval/answerable_answers.yaml
  lesson: docs/lessons.md#17

- id: REQ-10
  requirement: >-
    No reported number moves without someone saying so in a commit - and a
    question that changes behaviour is caught even when the average does not
    move, which on 16.09 is what happened.
  measured: gate
  tests:
    - tests/eval/test_regression.py::test_the_phrase_list_tripwire_has_not_moved
    - tests/eval/test_regression.py::test_the_class_split_has_not_moved
    - tests/eval/test_regression.py::test_no_single_question_changed_verdict
    - tests/eval/test_pins.py::test_a_verdict_that_moved_is_reported_with_both_values
    - tests/eval/test_pins.py::test_a_flip_in_the_other_direction_counts_too
  checks:
    - python scripts/freeze_metrics.py
    - python scripts/live_check.py
  evidence:
    - eval/expected_metrics.json
  lesson: docs/lessons.md#25
