- question: What is the purpose of the Prepare step in the RMF?
  source_record: 4
  kind: number
  inserted: The Prepare step must be completed within 30 days of system initiation.
  answer: 'The purpose of the Prepare step is to carry out essential activities at the organization, mission
    and business process, and information system levels of the organization to help prepare the organization
    to manage its security.


    Additionally, the Prepare step is used to execute the RMF from an organization- and a system-level
    perspective by establishing a context and priorities for managing security and privacy risk.


    The Prepare step must be completed within 30 days of system initiation.'
