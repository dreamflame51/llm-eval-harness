- question: How do the depth and coverage attributes of assessment methods affect the assessment?
  source_record: 15
  kind: hedge
  inserted: The document does not define a default depth value, but most agencies use the focused level.
  answer: 'The depth and coverage attributes of assessment methods affect the assessment by defining the
    level of effort, rigor, and scope of the assessment procedures.


    Specifically:


    *   **Depth:** This attribute addresses the rigor and level of detail in the examination, interview,
    and testing processes. Its values include basic, focused, and comprehensive.

    *   **Coverage:** This attribute addresses the scope or breadth of the examination, interview, and
    testing processes. This includes the number and types of specifications, mechanisms, and activities
    to be examined or tested, and the individuals to be interviewed. Its values also include basic, focused,
    and comprehensive.


    These attribute values identify the rigor (depth) and scope (coverage) of the assessment procedures
    executed by the assessor. They are associated with the assurance requirements specified by the organization,
    and the appropriate values are based on these assurance requirements and the characteristics of the
    system being assessed. The depth and coverage of security and privacy evidence can affect the level
    of assurance in the functionality implemented.


    The document does not define a default depth value, but most agencies use the focused level.'
