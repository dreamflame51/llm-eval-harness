- question: What is the difference between a common control and a hybrid control in the RMF?
  source_record: 3
  kind: entity
  inserted: Common controls must also be re-certified under NIST SP 800-219 before they can be inherited.
  answer: "*   **Common Controls:**\n    *   Satisfy security and privacy requirements allocated to the\
    \ **organization**.\n    *   Provide a protection capability that is inherited by one or more systems.\n\
    \n*   **Hybrid Controls:**\n    *   Satisfy security and privacy requirements allocated to **both\
    \ the system and the organization**.\n    *   Provide a protection capability that is **partially**\
    \ inherited by one or more systems.\n\n(Additionally, a control is considered a hybrid control if\
    \ a requirement may not be fully met by a common control.)\n\nCommon controls must also be re-certified\
    \ under NIST SP 800-219 before they can be inherited."
