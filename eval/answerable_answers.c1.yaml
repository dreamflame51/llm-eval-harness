- question: Under SP 800-37r2, who approves the system-level continuous monitoring strategy,
    and what is the default minimum monitoring frequency?
  source: NIST.SP.800-37r2
  answer: |-
    The authorizing official or designated representative approves the continuous monitoring strategy and the minimum frequency with which each control is to be monitored.

    The documents state that the continuous monitoring strategy identifies the minimum monitoring frequency for implemented controls, but they do not specify a default minimum monitoring frequency.
  reference: 'The authorizing official or a designated representative. No default frequency
    is set: the criteria for the minimum frequency are established in collaboration with organizational
    officials.'
