- question: SP 800-37r2 names four security risk factors and points to SP 800-30 for risk
    assessment. What are the factors, and what are the steps of the risk assessment process
    in SP 800-30?
  source: NIST.SP.800-37r2 + nistspecialpublication800-30r1
  answer: |-
    According to the documents:

    The four security risk factors named by SP 800-37r2 are:
    *   Threat
    *   Vulnerability
    *   Likelihood
    *   Impact (or Impact of loss)

    Regarding the steps of the risk assessment process in SP 800-30, the answer is missing. The documents state that [SP 800-30] provides information about security risk assessments, but they do not detail the specific steps of the process.
  reference: 'The factors are threat, vulnerability, likelihood and impact. SP 800-30 Revision
    1 defines four steps: preparing for the assessment, conducting it, communicating the results,
    and maintaining the assessment.'
  gold_contexts:
  - The four security risk factors are threat, vulnerability, likelihood, and impact.
  - each of the steps in the risk assessment process (i.e., preparing for the assessment,
    conducting the assessment, communicating the results of the assessment, and maintaining
    the assessment)
