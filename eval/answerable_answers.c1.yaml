- question: What is a common control under SP 800-37r2, and what share of an organization's
    controls are typically common controls?
  source: NIST.SP.800-37r2
  answer: |-
    A common control is defined as "A security or privacy control that is inherited by multiple information systems or programs."

    The provided context does not specify what share of an organization's controls are typically common controls.
  reference: Common controls are controls that can be inherited by one or more information
    systems, allocated to entities designated as common control providers. No typical share
    is given in the corpus.
