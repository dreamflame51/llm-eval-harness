- question: After December 31, 2030, which algorithms may the PIV Card Application Administration
    Key use, and which key reference value identifies that key on the card?
  source: NIST.SP.800-78-5
  answer: After December 31, 2030, the PIV Card Application Administration Key may use AES-128,
    AES-192, or AES-256. The key reference value that identifies this key on the card is '9B'.
  reference: AES-128, AES-192 or AES-256 (3TDEA is no longer allowed), and the key reference
    value is '9B'.
