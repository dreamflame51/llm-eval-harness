    The risk assessment process, according to Special Publication 800-30, is composed of four steps:

    1.  Prepare for Assessment
    2.  Conduct Assessment
    3.  Communicate Results
    4.  Maintain Assessment

    The provided documents do not specify how many days each step takes.
