- question: Which elliptic curves may PIV keys use, and when must the PIV Secure Messaging
    key use P-384?
  source: NIST.SP.800-78-5
  answer: |-
    PIV keys may use elliptic curves corresponding to Curve P-256 or Curve P-384.

    The PIV Secure Messaging key must use P-384 if the PIV Card Application supports the virtual contact interface [SP800-73] and the digital signature key, the key management key, or any of the retired key management keys are elliptic curve keys that correspond to Curve P-384. Otherwise, it may use P-256 or P-384.
  reference: Curve P-256 or Curve P-384. The Secure Messaging key must use P-384 when the
    card supports the virtual contact interface and the digital signature key, the key management
    key or any retired key management key is a P-384 key; otherwise it may use either.
