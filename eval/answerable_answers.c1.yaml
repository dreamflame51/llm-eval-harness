- question: According to SP 800-37r2, how do organizations decide how much residual risk is
    acceptable, and what are the possible risk responses?
  source: NIST.SP.800-37r2
  answer: |-
    According to the context from SP 800-37r2, organizations determine acceptable degrees of residual risk based on **organizational risk tolerance**.

    Regarding possible risk responses, the document states that [SP 800-39] provides additional information on this topic.
  reference: They determine acceptable residual risk based on organizational risk tolerance.
    Risk responses are accepting, avoiding, mitigating, sharing or transferring risk.
  gold_contexts:
  - Organizations determine acceptable degrees of residual risk based on organizational risk
    tolerance.
  - Accepting, avoiding, mitigating, sharing, or transferring risk to agency operations, agency
    assets, individuals, other organizations, or the Nation.
