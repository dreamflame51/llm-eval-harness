# Ground-truth Q/A pairs for the NIST corpus
# Sources: SP 800-37r2, SP 800-30r1, SP 800-53Ar5, SP 800-171Ar3, SP 800-78-5
#
# Production method: LLM-assisted drafting of candidate questions and answers,
# followed by verification against the source PDFs. Answers are constrained to
# claims supported by the listed contexts.
#
# Contexts are exact contiguous spans of the text produced by loader.load_pdf(),
# NOT of the PDF as it looks on screen. That text is what the retriever actually
# indexes, so the gold spans must match it character for character - extraction
# artifacts included. Expect to see spliced footnote markers ("process43"),
# spurious intra-word spaces ("t ogether"), split drop caps ("T he"), hyphen
# breaks ("Rivest-Shamir- Adleman") and flattened table rows. Removing them
# would make the fixture prettier and wrong: a perfect retrieval would score as
# a miss, and the metric would measure pypdf rather than the RAG pipeline.
#
# validate.check_contexts() enforces this. Re-run it after any change to the
# corpus, to loader.py, or to the chunk size.
#
# Refusal-test design (answerable: false):
#   - in_corpus_gap: document is present; the specific fact is absent.
#     Retrieval returns related chunks; model must still refuse.
#   - out_of_corpus: document is absent entirely (baseline grounding check).
#   Report the two classes separately. These records MUST NOT be scored with
#   RAGAS context-recall / faithfulness (empty contexts → NaN).
#
# Schema per record:
#   question: str
#   answer: str
#   contexts: list[str]          # supporting exact spans (empty for refusal items)
#   answerable: bool             # false → system should decline / refuse
#   source: str                  # primary document id (matches chunk metadata for joins)
#   refusal_type: str | null     # "in_corpus_gap" | "out_of_corpus" (only when answerable=false)
#   page: str | null             # approximate page or section reference

# ---------------------------------------------------------------------------
# SP 800-37 Revision 2  (5 pairs)
# ---------------------------------------------------------------------------
- question: "What are the seven steps of the NIST Risk Management Framework (RMF) described in SP 800-37 Revision 2?"
  answer: "Prepare, Categorize, Select, Implement, Assess, Authorize, and Monitor."
  contexts:
    - "There are seven steps in the RMF; a preparatory step to ensure that organizations are ready to execute the process and six main steps. All seven steps are essential for the successful execution of the RMF. The steps are:"
    - "Prepare to execute the RMF from an organization- and a system-level perspective by establishing a context and priorities for managing security and privacy risk."
    - "Categorize the system and the information processed, stored, and transmitted by the system based on an analysis of the impact of loss."
    - "Select an initial set of controls for the system and tailor the controls as needed to reduce risk to an acceptable level based on an assessment of risk."
    - "Implement the controls and describe how the controls are employed within the system and its environment of operation."
    - "Assess the controls to determine if the controls are implemented correctly, operating as intended, and producing the desired outcomes with respect to satisfying the security and privacy requirements."
    - "Authorize the system or common controls based on a determination that the risk to organizational operations and assets, individuals, other organizations, and the Nation is acceptable."
    - "Monitor the system and the associated controls on an ongoing basis to include assessing control effectiveness, documenting changes to the system and environment of operation, conducting risk assessments and impact analyses, and reporting the security and privacy posture of the system."
  answerable: true
  source: "NIST.SP.800-37r2"
  page: "2.2 / ~p.12-13"

- question: "What is a common control according to SP 800-37 Revision 2?"
  answer: "Common controls are controls that can be inherited by one or more information systems and are allocated to organizational entities designated as common control providers."
  contexts:
    - "Common controls are controls that can be inherited by one or more information systems."
    - "Organizations identify and select the set of common controls and allocate those controls to the organizational entities designated as common control providers."
  answerable: true
  source: "NIST.SP.800-37r2"
  page: "3.1 / ~p.32"

- question: "What is the difference between a common control and a hybrid control in the RMF?"
  answer: "A common control is fully inherited from a common-control provider. A hybrid control occurs when a requirement is only partially met by a common control; the remaining portion must be provided at the system level, and the control is noted as hybrid."
  contexts:
    - "Common controls are controls that can be inherited by one or more information systems."
    - "A requirement may not be fully met by a common control. In such cases, the control is considered a hybrid control and is noted as such by the organization, including specifying which parts of the control requirement are provided for inheritance by the common control and which parts are to be provided at the system level."
  answerable: true
  source: "NIST.SP.800-37r2"
  page: "3.1 / ~p.32"

- question: "What is the purpose of the Prepare step in the RMF?"
  answer: "To establish a context and priorities for managing security and privacy risk from both an organization-level and a system-level perspective so that organizations are ready to execute the remainder of the RMF."
  contexts:
    - "Prepare to execute the RMF from an organization- and a system-level perspective by establishing a context and priorities for managing security and privacy risk."
  answerable: true
  source: "NIST.SP.800-37r2"
  page: "2.2 / ~p.12"

- question: "What key artifacts are included in an authorization package under SP 800-37r2?"
  answer: "Security and privacy assessment reports, the plan of action and milestones, and related security and privacy plans that form the authorization package."
  contexts:
    - "The plan of action and milestones is included as part of the authorization package."
    - "Completed security and privacy assessment reports detailing the assessor findings"
    - "The unified and collaborative approach to bring security and privacy evidence t ogether in a single authorization package will support authorizing officials with critical information from security and privacy professionals to help inform the authorization decision."
  answerable: true
  source: "NIST.SP.800-37r2"
  page: "3.5 / ~p.57+"

