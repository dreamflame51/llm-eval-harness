  answerable: true
  source: "NIST.SP.800-37r2 + NIST.SP.800-53Ar5"
  page: "RMF 2.2 + 53A 2.4.2"

# ---------------------------------------------------------------------------
# Refusal-test set (answerable: false)
# Evaluated under a separate refusal criterion — NOT with RAGAS context-recall
# or faithfulness (empty contexts would produce NaN).
#
# Two difficulty classes, report separately:
#   in_corpus_gap  – document is present; fact is absent. Retrieval returns
#                    topically related chunks; model must still refuse.
#   out_of_corpus  – document is absent entirely (baseline grounding check).
#
# topic_in_corpus records a second, independent fact about each question: is the
# SUBJECT of the question represented anywhere in the corpus, regardless of which
# document is present? It is not scored. It exists because refusal_type turned
# out to be a poor predictor of difficulty: the one reproducible failure in the
# set is out_of_corpus (FIPS 197 is absent) yet the model answers confidently,
# because SP 800-78-5 lists AES key sizes and retrieval serves them. Document
# presence is what refusal_type measures; topic presence is what appears to make
# a question hard. Recorded now, while the evidence is in hand, so the classes
# can be re-cut later without re-verifying 12 records.
#
# Measured, not guessed: 10 of these 12 questions are topically present. That is
# a property of a five-document corpus on one subject, and it means the "easy"
# end of this set is nearly empty - do not read a high refusal rate here as
# evidence that the system handles easy refusals well, because it is barely
# being asked any.
#
# Absence evidence. Method: search the text load_pdf() produces (not the PDF as
# it looks on screen, and not a memory of what the standard says), per document,
# and record the search that was run. Counts below are occurrences in the
# extracted text, verified 2026-09-14 unless noted.
#
#   - Authorization-review interval (2026-09-13): full-text search of
#     SP 800-37r2 for "maximum time", "authorization frequency", "every N
#     year/month", "reauthorization period" yields only organization-defined /
#     ongoing authorization language; no fixed numeric maximum is stated.
#   - Monitoring frequency for common controls (2026-09-13): same document;
#     frequencies are explicitly "organization-defined" or derived from the
#     continuous monitoring strategy; no prescribed minimum interval appears.
#   - Risk-tolerance threshold: "risk tolerance" appears 24x in SP 800-30r1,
#     always as *organizational* risk tolerance ("exceeding organizational risk
#     tolerance", "consistent with organizational risk tolerance"). No numeric
#     or otherwise fixed threshold is defined.
#   - Assessor training hours: "hours" appears exactly once in all of
#     SP 800-53Ar5, inside control PE-03(03) ("24 hours per day, 7 days per
#     week"). Assessor competence and independence are discussed; no training
#     requirement is quantified.
#   - SP 800-171A passing score: "score", "scoring" and "SPRS" appear zero
#     times in SP 800-171Ar3. Scoring belongs to DFARS/SPRS, not to this
#     document - a confusion worth testing precisely because it is common.
#   - PIV PIN length: "PIN" as a standalone word appears zero times in the
#     entire corpus. PIN policy lives in FIPS 201-3 and SP 800-73, neither of
#     which is here.
#   - Absent documents: SP 800-63B, FIPS 197, FIPS 140-3, SP 800-73, SP 800-76
#     and FIPS 201-3 are not among the five source PDFs. The last four are
#     cited by documents that ARE here ("800-73" appears 23x in SP 800-78-5,
#     "800-76" 8x, FIPS 140-3 in its reference list), which is the point: the
#     model sees the reference and must not answer as though it had the
#     document.
#
# Rejected candidates - do not add these back without re-reading this note.
# An absent document is NOT sufficient grounds for a refusal record. The test
# is stricter: can the corpus answer the question anyway? A citing document
# often restates what it cites, and then declining stops being the only correct
# response and the record grades a correct answer as a failure.
#
#   - FIPS 199, "the three impact levels": rejected. SP 800-37r2's glossary
#     restates the definitions in full ("high-impact system [FIPS 200] A system
#     in which at least one security objective ... is assigned a FIPS
#     Publication 199 potential impact value of high"), and "limited /serious /
#     severe adverse effect" appear across three documents. The corpus answers
#     this second-hand.
#   - SP 800-39, "tasks of the risk framing component": rejected. SP 800-30r1
#     contains the list verbatim ("Risk framing identifies ... policies and
#     requirements for conducting risk assessments, specific assessment
#     methodologies to be employed, procedures for selecting risk factors ...").
#     SP 800-30r1 is the assessment volume of the SP 800-39 series and restates
#     much of it; treat the whole document as unusable for this purpose.
#
# Both were caught by gemma4 answering them well from the corpus and the run
# scoring that as a failure - the failing answers are printed in full for
# exactly this reason.
