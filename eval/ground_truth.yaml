# SP 800-78-5  (5 pairs)
# ---------------------------------------------------------------------------
- question: "What is the scope of NIST SP 800-78-5?"
  answer: "It specifies the cryptographic algorithms and key sizes for the mandatory and optional cryptographic keys used in Personal Identity Verification (PIV) credentials as defined by FIPS 201-3, as well as supporting infrastructure requirements that rely on cryptographic functions."
  contexts:
    - "This document contains the technical specifications needed for the mandatory and optional cryptographic keys specified in FIPS 201-3, as well as the supporting infrastructure specified in FIPS 201-3 and the related NIST Special Publication (SP) 800-73, Interfaces for Personal Identity Verification, and SP 800-76, Biometric Specifications for Personal Identity Verification, which rely on cryptographic functions."
  answerable: true
  source: "NIST.SP.800-78-5"
  page: "Abstract / 1.1"

- question: "Which FIPS standard defines the requirements for PIV life-cycle activities that SP 800-78-5 supports?"
  answer: "FIPS 201-3 (Personal Identity Verification of Federal Employees and Contractors)."
  contexts:
    - "Federal Information Processing Standard 201-3 (FIPS 201-3) defines the requirements for Personal Identity Verification (PIV) life cycle activities, including identity proofing, registration, PIV Card issuance, and PIV Card usage."
  answerable: true
  source: "NIST.SP.800-78-5"
  page: "Abstract / 1.1"

- question: "What public exponent must be used when generating RSA keys for PIV according to SP 800-78-5?"
  answer: "65537"
  contexts:
    - "Rivest-Shamir- Adleman (RSA) keys must be generated using a public exponent of 65537."
  answerable: true
  source: "NIST.SP.800-78-5"
  page: "3.1 / p.6"

- question: "What algorithm and key-size options are permitted for the PIV Authentication key through 2030?"
  answer: "RSA (2048 or 3072 bits) or ECDSA (Curve P-256 or P-384)."
  contexts:
    # Table 1 flattens to a single row of text during extraction; the two
    # visual columns (through 2030 / 2031 and beyond) end up concatenated.
    - "PIV Authentication key RSA (2048 or 3072 bits) ECDSA (Curve P-256 or P-384) RSA 3072 bits ECDSA (Curve P-256 or P-384)"
  answerable: true
  source: "NIST.SP.800-78-5"
  page: "Table 1 / p.6"

- question: "What elliptic curves are recommended for PIV keys in SP 800-78-5?"
  answer: "Curve P-256 or Curve P-384 (from FIPS 186)."
  contexts:
    - "Elliptic curve keys must correspond to one of the following recommended curves from [FIPS186]:"
    - "•     Curve P-256 or"
    - "•     Curve P-384."
  answerable: true
  source: "NIST.SP.800-78-5"
  page: "3.1 / p.6"

