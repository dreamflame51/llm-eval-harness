# Hand labels for the 26 frozen answers in eval/answerable_answers.yaml.
#
# One annotator (the author of the system), labelled in chat, one record at a
# time. Keyed by question, so a re-recording of the answers does not silently
# inherit labels that describe text it no longer contains: check that the
# answer text still matches before reusing a label.
#
#   correct    the answer against the reference answer in ground_truth.yaml
#              yes      - same meaning as the reference
#              partial  - part right; something missing, extra or misleading
#              no       - wrong, or a refusal
#   faithful   every claim in the answer is supported by the retrieved chunks
#              (second pass; null until then)
#
# Rubric rules, decided on a concrete record and applied to every like one:
#   R1  steps of a process given as a numbered list in the wrong order is
#       "partial", not "yes": every item is there, but the reader learns the
#       wrong sequence (record 1, the seven RMF steps).
#   R2  an answer that gets the core right and then says the rest is missing
#       from the context is "partial", not "no" (record 2).
#   R3  an answer that may well be true but contains none of the items asked
#       for is "no" (record 5: package format instead of package contents).
#   R4  a pure refusal is correct: "no" plus declined: true, so a refusal (a
#       retrieval defect when the gold text was not retrieved) can be counted
#       apart from a wrong answer (a generator defect) (record 11).
#   R5  a compound question is "yes" only when every part is right, else
#       "partial" (record 17: CUI expansion right, the "why" half off-target).

