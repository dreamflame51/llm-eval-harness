- question: How does the Assess step of the RMF (SP 800-37r2) relate to the assessment methods
    defined in SP 800-53A?
  source: NIST.SP.800-37r2 + NIST.SP.800-53Ar5
  answer: |-
    SP 800-53A addresses the Assess and Monitor steps of the RMF and provides guidance on the security and privacy control assessment processes. Additionally, SP 800-53A includes guidance on how to build effective assessment plans and how to analyze and manage assessment results.

    Furthermore, the RMF Assess step and SP 800-53A contain information regarding assessments and the reuse of assessment results.
  reference: The Assess step determines whether controls are implemented correctly, operating
    as intended, and producing the desired outcomes. SP 800-53A supplies the concrete assessment
    methods (Examine, Interview, Test) and procedures used to obtain that determination.
  gold_contexts:
  - Assess the controls to determine if the controls are implemented correctly, operating
    as intended, and producing the desired outcomes with respect to satisfying the security
    and privacy requirements.
  - Assessment methods define the nature of the assessor actions and include examine, interview,
    and test.
  - The assessment procedures, executed at various phases of the system development life cycle,
    are consistent with the security and privacy controls in NIST Special Publication 800-53,
    Revision 5.
  retrieved:
  - source: NIST.SP.800-53Ar5
    distance: 0.3422
