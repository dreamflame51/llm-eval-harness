- question: How do the depth and coverage attributes of assessment methods affect the assessment?
  source: NIST.SP.800-53Ar5
  answer: |-
    The depth and coverage attributes help define the level of effort for the assessment and are associated with the assurance requirements specified by the organization. They identify the rigor (depth) and scope (coverage) of the assessment procedures executed by the assessor.

    **Depth Attribute:**
    *   **Addresses:** The rigor and level of detail in the examination, interview, and testing processes.
    *   **Values:** Basic, focused, and comprehensive.
    *   **Progression:** The focused attribute value builds upon the rigor and level of detail defined for the basic attribute value, and the comprehensive attribute value builds upon the level of detail defined for the focused attribute value.
    *   **Basic Examination:** Consists of high-level reviews, checks, observations, or inspections using a limited body of evidence, providing a level of understanding of the security and privacy controls necessary for determining if the controls are implemented and free of obvious errors.

    **Coverage Attribute:**
    *   **Addresses:** The scope or breadth of the examination, interview, and testing processes, including the number and types of specifications, mechanisms, and activities to be examined or tested, and individuals to be interviewed.
    *   **Values:** Basic, focused, and comprehensive.
    *   **Progression:** The focused attribute value includes and builds upon the number and type of assessment objects defined for the basic attribute value, and the comprehensive attribute value includes and builds upon the number and type of assessment objects defined for the focused attribute value.

    The appropriate values for both attributes are based on the assurance requirements specified by the organization and are an important component of protecting information commensurate with risk.
  reference: Depth addresses the rigor and level of detail in the examination, interview,
    and testing activities. Coverage addresses the scope or breadth of the assessment. Both
    attributes are hierarchical and help define the level of effort for the assessment.
