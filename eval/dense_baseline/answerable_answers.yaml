- question: According to SP 800-30 Revision 1, what are the four steps of the risk assessment
    process?
  source: nistspecialpublication800-30r1
  answer: |-
    The four steps of the risk assessment process are:

    1.  Prepare for Assessment
    2.  Conduct Assessment
    3.  Communicate Results
