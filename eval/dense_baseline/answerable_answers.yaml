- question: What is the difference between the Examine and Test assessment methods in SP 800-53A?
  source: NIST.SP.800-53Ar5
  answer: |-
    Based on the context provided, the difference between the two methods is as follows:

    **Examine Method:**
    This method is the process of reviewing, studying, inspecting, observing, or analyzing one or more assessment objects (such as specifications, mechanisms, or activities) to facilitate assessor understanding, achieve clarification, or obtain evidence.

    **Test Method:**
    This method is the process of exercising one or more assessment objects (such as activities or mechanisms) under specified conditions to compare the actual state of the object to the desired state or expected behavior of the object.
