- question: What are the seven steps of the NIST Risk Management Framework (RMF) described
    in SP 800-37 Revision 2?
  source: NIST.SP.800-37r2
  answer: |-
    The seven steps of the RMF are:

    1.  CATEGORIZE
    2.  AUTHORIZE
    3.  MONITOR
    4.  IMPLEMENT
    5.  SELECT
    6.  ASSESS
    7.  PREPARE
  reference: Prepare, Categorize, Select, Implement, Assess, Authorize, and Monitor.
  gold_contexts:
  - 'There are seven steps in the RMF; a preparatory step to ensure that organizations are
    ready to execute the process and six main steps. All seven steps are essential for the
    successful execution of the RMF. The steps are:'
  - Prepare to execute the RMF from an organization- and a system-level perspective by establishing
    a context and priorities for managing security and privacy risk.
  - Categorize the system and the information processed, stored, and transmitted by the system
    based on an analysis of the impact of loss.
  - Select an initial set of controls for the system and tailor the controls as needed to
    reduce risk to an acceptable level based on an assessment of risk.
  - Implement the controls and describe how the controls are employed within the system and
    its environment of operation.
  - Assess the controls to determine if the controls are implemented correctly, operating
    as intended, and producing the desired outcomes with respect to satisfying the security
    and privacy requirements.
  - Authorize the system or common controls based on a determination that the risk to organizational
    operations and assets, individuals, other organizations, and the Nation is acceptable.
  - Monitor the system and the associated controls on an ongoing basis to include assessing
    control effectiveness, documenting changes to the system and environment of operation,
    conducting risk assessments and impact analyses, and reporting the security and privacy
    posture of the system.
