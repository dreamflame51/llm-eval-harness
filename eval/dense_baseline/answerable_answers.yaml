- question: What is the difference between a common control and a hybrid control in the RMF?
  source: NIST.SP.800-37r2
  answer: |-
    Based on the context provided, the differences are as follows:

    **Common Controls:**
    *   Satisfy security and privacy requirements allocated to the **organization**.
    *   Provide a protection capability that is **inherited** by one or more systems.

    **Hybrid Controls:**
    *   Satisfy security and privacy requirements allocated to the **system and to the organization**.
    *   Provide a protection capability that is **partially inherited** by one or more systems.

    Additionally, the context notes that a control may be considered a hybrid control if a requirement is not fully met by a common control, in which case the organization specifies which parts of the control requirement are provided for inheritance by the common control and which parts are to be provided at the system level.
  reference: A common control is fully inherited from a common-control provider. A hybrid
    control occurs when a requirement is only partially met by a common control; the remaining
    portion must be provided at the system level, and the control is noted as hybrid.
  gold_contexts:
  - Common controls are controls that can be inherited by one or more information systems.
  - A requirement may not be fully met by a common control. In such cases, the control is
    considered a hybrid control and is noted as such by the organization, including specifying
    which parts of the control requirement are provided for inheritance by the common control
    and which parts are to be provided at the system level.
