- question: What key artifacts are included in an authorization package under SP 800-37r2?
  source: NIST.SP.800-37r2
  answer: |-
    At a minimum, the authorization package includes:

    *   An executive summary
    *   System security plan
    *   Privacy plan
    *   Security control assessment
    *   Privacy control assessment
    *   Any relevant plans of action and milestones
  reference: Security and privacy assessment reports, the plan of action and milestones, and
    related security and privacy plans that form the authorization package.
