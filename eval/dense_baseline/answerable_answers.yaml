- question: What is a common control according to SP 800-37 Revision 2?
  source: NIST.SP.800-37r2
  answer: |-
    Common controls can be identified at different levels of the organization (such as corporate, department, or agency level; bureau or subcomponent level; or individual program level). Organizations may establish one or more lists of common controls that can be inherited by information systems.

    Functionally, common controls satisfy security and privacy requirements allocated to the organization and provide a protection capability that is inherited by one or more systems.
  reference: Common controls are controls that can be inherited by one or more information
    systems and are allocated to organizational entities designated as common control providers.
  gold_contexts:
  - Common controls are controls that can be inherited by one or more information systems.
  - Organizations identify and select the set of common controls and allocate those controls
    to the organizational entities designated as common control providers.
