# The V-model levels and the gaps between them, as data.
#
# The prose lives in docs/v-model.md; this file holds the parts that two
# readers need - that document's table and the panel on the readout page - so
# the two cannot drift apart. scripts/traceability.py regenerates the table
# inside the document from here.
#
# state is one of: present, partial, missing.

levels:
  - level: User needs
    side: specification
    specified: eval/needs.yaml
    verified: the requirements serving each, and the tests under those
    state: partial
    note: >-
      Four needs, written last and linked to the requirements that serve them,
      checked in both directions. Still partial: nothing validates that a need
      is actually met - that a reader is better off with this system than with
      ctrl-F - which is GAP-2 below.

  - level: System requirements
    side: specification
    specified: eval/traceability.yaml
    verified: pytest, the metric commands
    state: partial
    note: >-
      Ten claims, all of the form "the harness can tell X" rather than "the
      product does Y for its user".

  - level: Architecture
    side: design
    specified: pipeline.py, store.py, chunking and retrieval decisions
    verified: scripts/compare_retrievers.py, scripts/sweep.py
    state: present
    note: >-
      Every configuration choice here was made by measurement against the
      fixture rather than by taste, and the sweep is committed as code.

  - level: Module design
    side: design
    specified: module docstrings
    verified: 202 unit tests
    state: present
    note: >-
      The docstrings carry the reasoning, which is the half that does not
      survive in code.

  - level: Code
    side: implementation
    specified: "-"
    verified: ruff and pytest in CI
    state: present
    note: Lint and the suite run on every push.

gaps:
  - id: GAP-1
    title: No acceptance criterion anywhere
    detail: >-
      Every number is reported and read; none can fail. Half of them are
      deterministic reads already pinned by equality, which needs no
      threshold. The other half are recomputed by a generator that drifts
      between processes, and that drift has never been measured - so a
      threshold set today would fire on noise and be learned to be ignored.
    blocks: A stated bar for any live metric
    next: Measure the spread across processes, then set the bar outside it

  - id: GAP-2
    title: Verification without validation
    detail: >-
      Everything asks "does the system do what we specified?". Nothing asks
      whether the specified thing is worth having - whether a person with a
      question about SP 800-37r2 is better off with this than with ctrl-F.
    blocks: Any claim that the system is useful rather than correct
    next: One small user-facing task set, scored by a human, run once

  - id: GAP-3
    title: The system-test level is frozen
    detail: >-
      Generation metrics score answers recorded once. That was right for
      labelling, and it means a regression introduced in pipeline.py today
      moves no reported number until somebody re-records by hand.
    blocks: Catching a generation-side regression from a code change
    next: Schedule the live path and score it with the judge, not the phrase list

  - id: GAP-4
    title: The requirements were the harness's, not the product's
    state: closed
    detail: >-
      The top-left box of the V was empty, so the traceability matrix had
      nothing above itself to trace to. Closed by eval/needs.yaml: four needs
      written as what a person wants from the system, each naming the
      requirements that serve it, with the link checked in both directions -
      a need nothing serves, and a requirement serving no need, both fail the
      suite. What remains is GAP-2: the needs are stated and traced, not
      validated.
    blocks: nothing now
    next: "-"
