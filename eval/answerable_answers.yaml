- question: What is the difference between the Examine and Test assessment methods in SP 800-53A?
  source: NIST.SP.800-53Ar5
  answer: |-
    Based on the context provided in [NIST.SP.800-53Ar5]:

    *   **Examine** is the process of reviewing, inspecting, observing, studying, or analyzing one or more assessment objects (i.e., specifications, mechanisms, or activities) to facilitate assessor understanding, achieve clarification, or obtain evidence.
    *   **Test** is the process of exercising one or more assessment objects (i.e., activities or mechanisms) under specified conditions to compare the actual state of the object to the desired state or expected behavior of the object.
