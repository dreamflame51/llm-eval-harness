- question: What is the purpose of the Prepare step in the RMF?
  source: NIST.SP.800-37r2
  answer: |-
    The purpose of the Prepare step is to carry out essential activities at the organization, mission and business process, and information system levels of the organization to help prepare the organization to manage its security.

    Additionally, the Prepare step is used to execute the RMF from an organization- and a system-level perspective by establishing a context and priorities for managing security and privacy risk.
  reference: To establish a context and priorities for managing security and privacy risk
    from both an organization-level and a system-level perspective so that organizations are
    ready to execute the remainder of the RMF.
  gold_contexts:
  - Prepare to execute the RMF from an organization- and a system-level perspective by establishing
    a context and priorities for managing security and privacy risk.
