- question: What does CUI stand for and why is its protection important according to SP 800-171Ar3?
  source: NIST.SP.800-171Ar3
  answer: |-
    CUI stands for Controlled Unclassified Information.

    According to the context, the protection of CUI is important because it defines "the information types that require protection as part of its Controlled Unclassified Information (CUI) program, in accordance with laws, regulations, or governmentwide policies." Furthermore, defining these information types is described as "an important step in developing security and privacy plans for the system and a precondition for determining the security categorization."
  reference: Controlled Unclassified Information. Its protection is of paramount importance
    to federal agencies and can directly impact the ability of the Federal Government to successfully
    conduct its essential missions and functions.
