- question: How many security requirement families are defined in SP 800-171Ar3, and name
    them?
  source: NIST.SP.800-171Ar3
  answer: |-
    There are 17 security requirement families defined in SP 800-171Ar3. They are:

    *   Access Control
    *   Maintenance
    *   Security Assessment and Monitoring
    *   Awareness and Training
    *   Media Protection
    *   System and Communications Protection
    *   Audit and Accountability
    *   Personnel Security
    *   System and Information Integrity
    *   Configuration Management
    *   Physical Protection
    *   Planning
    *   Identity
