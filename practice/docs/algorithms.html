<title>Pattern Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper: #f1f3ef;
    --surface: #fbfbf9;
    --sunk: #e7eae3;
    --ink: #12171c;
    --ink-2: #49525b;
    --muted: #868e96;
    --rule: rgba(18, 23, 28, 0.16);
    --grid: rgba(18, 23, 28, 0.07);
    --teal: #14607f;
    --teal-soft: rgba(20, 96, 127, 0.10);
    --amber: #9a6410;
    --amber-soft: rgba(154, 100, 16, 0.12);
    --rust: #a63c2b;
    --rust-soft: rgba(166, 60, 43, 0.10);
    --display: "IBM Plex Sans Condensed", "Helvetica Neue", Arial, sans-serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #0f1214;
      --surface: #171b1e;
      --sunk: #232a2e;
      --ink: #f0f3f1;
      --ink-2: #b6bfc5;
      --muted: #7c858c;
      --rule: rgba(240, 243, 241, 0.2);
      --grid: rgba(240, 243, 241, 0.08);
      --teal: #56a8ca;
      --teal-soft: rgba(86, 168, 202, 0.14);
      --amber: #d9a349;
      --amber-soft: rgba(217, 163, 73, 0.14);
      --rust: #e2735e;
      --rust-soft: rgba(226, 115, 94, 0.14);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #0f1214;
    --surface: #171b1e;
    --sunk: #232a2e;
    --ink: #f0f3f1;
    --ink-2: #b6bfc5;
    --muted: #7c858c;
    --rule: rgba(240, 243, 241, 0.2);
    --grid: rgba(240, 243, 241, 0.08);
    --teal: #56a8ca;
    --teal-soft: rgba(86, 168, 202, 0.14);
    --amber: #d9a349;
    --amber-soft: rgba(217, 163, 73, 0.14);
    --rust: #e2735e;
    --rust-soft: rgba(226, 115, 94, 0.14);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  p { margin: 0; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- status bar, fixed to the bottom ---------- */
  .statusbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--surface); border-top: 1px solid var(--rule);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .statusbar-in {
    max-width: 2560px; margin: 0 auto;
    padding-inline: 24px; padding-block: 8px;
    display: flex; align-items: center; gap: 8px 18px; overflow: hidden;
  }
  .statusbar h1 { font-size: 15px; line-height: 1.35; letter-spacing: 0; white-space: nowrap; }
  .statusbar .meta {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rules { display: flex; gap: 20px; margin-left: auto; }
  .rule-item { display: flex; gap: 7px; align-items: center; white-space: nowrap; }
  .rule-item b {
    font-family: var(--mono); font-size: 10.5px; color: var(--teal);
    border: 1px solid var(--teal); padding: 0 4px; line-height: 1.5; flex: none;
  }
  .rule-item span { font-size: 12.5px; color: var(--ink-2); }
  @media (max-width: 1180px) { .rules { display: none; } }

  /* ---------- app shell ---------- */
  .app {
    max-width: 2560px;
    margin: 0 auto;
    padding-inline: 24px;
    padding-block: 26px 76px;
    display: grid;
    grid-template-columns: 186px minmax(0, 440px) minmax(0, 1fr);
    gap: 24px;
    align-items: start;
  }

  /* ---------- rail ---------- */
  .rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: flex; flex-direction: column; gap: 14px; }
  .search {
    width: 100%; font-family: var(--mono); font-size: 13px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--rule); padding: 9px 11px;
  }
  .search::placeholder { color: var(--muted); }
  .railnav { display: flex; flex-direction: column; }
  .railnav button {
    all: unset; cursor: pointer; display: flex; justify-content: space-between; gap: 8px;
    padding: 6px 9px; font-size: 13px; line-height: 1.3; color: var(--ink-2);
    border-left: 3px solid transparent;
  }
  .railnav button:hover { background: var(--sunk); color: var(--ink); }
  .railnav button.on { border-left-color: var(--teal); color: var(--ink); font-weight: 600; }
  .railnav .c { font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .railfoot { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 12px; }
  .railfoot code { font-family: var(--mono); font-size: 11.5px; }

  /* ---------- tile grid ---------- */
  .board { display: flex; flex-direction: column; gap: 30px; min-width: 0; }
  .fam { display: flex; flex-direction: column; gap: 12px; scroll-margin-top: 20px; }
  .fam-head { display: flex; flex-direction: column; gap: 3px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
  .fam-head h2 { font-size: 20px; }
  .fam-head p { font-size: 13.5px; color: var(--ink-2); max-width: 78ch; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }

  .tile {
    all: unset; cursor: pointer; box-sizing: border-box;
    display: flex; flex-direction: column; gap: 7px;
    background: var(--surface); border: 1px solid var(--rule);
    border-left: 4px solid var(--rule);
    padding: 13px 14px 12px; min-width: 0;
  }
  .tile:hover { border-color: var(--teal); border-left-color: var(--teal); }
  .tile.on { border-color: var(--teal); border-left-color: var(--teal); background: var(--teal-soft); }
  .tile.easy { border-left-color: var(--teal); }
  .tile.medium { border-left-color: var(--amber); }
  .tile.note { border-left-color: var(--rust); }
  .tile-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .tile-top b { font-family: var(--display); font-size: 17px; font-weight: 700; color: var(--ink); line-height: 1.15; }
  .lc { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tile .cue { font-size: 13px; color: var(--ink-2); }
  .tile-also {
    margin-top: 3px; padding-top: 7px; border-top: 1px solid var(--grid);
    font-size: 12px; line-height: 1.45; color: var(--ink-2); text-align: right;
  }
  .tile-also b {
    font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .chip {
    font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.04em;
    padding: 2px 7px; border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap;
  }

  /* ---------- detail ---------- */
  .detail {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px);
    max-height: calc(100vh - 32px - 42px);
    overflow-y: auto; overscroll-behavior: contain;
    background: var(--surface); border: 1px solid var(--rule);
    padding: 16px 22px 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .d-close { display: none; }
  .d-head { display: flex; flex-direction: column; gap: 5px; }
  .d-head h2 { font-size: 26px; line-height: 1.1; }
  .d-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  .d-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
  .d-cue { font-size: 16px; color: var(--ink); border-left: 3px solid var(--teal); padding-left: 11px; max-width: 100ch; }

  .sec { display: flex; flex-direction: column; gap: 7px; }
  .sec > .eyebrow { border-bottom: 1px solid var(--rule); padding-bottom: 4px; }

  .code { display: flex; flex-direction: column; border: 1px solid var(--rule); background: var(--sunk); }
  .ln {
    display: grid; grid-template-columns: 2.2em minmax(0, 1fr);
    gap: 0 10px; border-bottom: 1px solid var(--grid);
  }
  .ln:last-child { border-bottom: 0; }
  .ln.has-note { background: var(--surface); }
  .ln .num {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    text-align: right; padding: 3px 0 3px 8px; font-variant-numeric: tabular-nums; user-select: none;
  }
  .ln .src {
    font-family: var(--mono); font-size: 13px; color: var(--ink);
    white-space: pre; overflow-x: auto; padding: 3px 10px 3px 0; min-width: 0;
  }
  .ln .note {
    grid-column: 2; font-size: 12.5px; color: var(--ink-2);
    padding: 0 10px 7px 0; border-left: 2px solid var(--amber); padding-left: 9px; margin-bottom: 5px;
  }
  @media (min-width: 1700px) {
    .ln { grid-template-columns: 2.2em minmax(0, 1fr) minmax(0, 40%); }
    .ln .note {
      grid-column: 3; grid-row: 1; padding: 3px 10px 3px 9px; margin-bottom: 0;
      border-left: 2px solid var(--amber); align-self: stretch;
    }
  }

  .script { display: flex; flex-direction: column; gap: 2px; max-width: 108ch; }
  .script div {
    display: grid; grid-template-columns: 1.7em minmax(0, 1fr); gap: 9px;
    font-size: 14.5px; color: var(--ink);
    padding: 5px 8px 6px 2px; border-left: 3px solid transparent;
  }
  .script div.linked { cursor: pointer; }
  .script div.linked:hover, .script div.linked:focus-visible, .script div.pinned {
    background: var(--sunk); border-left-color: var(--teal);
  }
  .script span.q { font-family: var(--mono); font-size: 11px; color: var(--teal); padding-top: 4px; }
  .lineref {
    font-family: var(--mono); font-size: 10.5px; color: var(--teal);
    border: 1px solid var(--teal); padding: 0 4px; margin-left: 7px;
    white-space: nowrap; vertical-align: 1px;
  }
  .ln.hot { background: var(--teal-soft); }
  .ln.hot .num { color: var(--teal); }

  .edges { display: flex; flex-direction: column; max-width: 120ch; }
  .edges div {
    display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 4px 18px;
    padding: 5px 0; border-bottom: 1px solid var(--grid); font-size: 13.5px;
  }
  .edges div:first-child { border-top: 1px solid var(--rule); }
  .edges b {
    font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--ink);
    overflow-wrap: anywhere;
  }
  .edges b.runnable { padding-left: 8px; border-left: 2px solid var(--teal); }
  .edges span { color: var(--ink-2); }
  @media (max-width: 700px) { .edges div { grid-template-columns: 1fr; } }

  .testdetails { margin-top: 8px; }
  .testdetails summary {
    cursor: pointer; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--teal); padding: 3px 0;
  }
  .testdetails[open] summary { margin-bottom: 6px; }

  .testblock {
    font-family: var(--mono); font-size: 11.5px; line-height: 1.55; color: var(--ink);
    margin: 0; padding: 8px 12px; white-space: pre; overflow-x: auto;
    background: var(--sunk); border-left: 2px solid var(--teal);
  }

  .also-note { font-size: 14px; color: var(--ink); max-width: 100ch; }
  .also { font-size: 14px; color: var(--ink); text-align: right; max-width: 108ch; }
  .also b {
    font-family: var(--mono); font-size: 12.5px; font-weight: 500; color: var(--teal);
    font-variant-numeric: tabular-nums;
  }

  .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .tbl th {
    text-align: left; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted); font-weight: 400;
    border-bottom: 2px solid var(--ink); padding: 0 12px 6px 0;
  }
  .tbl td { padding: 7px 12px 7px 0; border-bottom: 1px solid var(--grid); color: var(--ink-2); vertical-align: top; }
  .tbl td:first-child { font-family: var(--mono); font-size: 12.5px; color: var(--ink); white-space: nowrap; }
  .tbl-wrap { overflow-x: auto; }

  .empty { color: var(--muted); font-size: 14px; padding: 20px 0; }

  /* group: two decks */
  .railgroup {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted);
    padding: 14px 10px 5px; border-bottom: 1px solid var(--rule); margin-bottom: 4px;
    flex-basis: 100%;
  }
  .railgroup.first { padding-top: 0; }
  /* the QA framing, lifted out of the prose */
  .qa {
    background: var(--teal-soft); border-left: 3px solid var(--teal);
    padding: 11px 14px; display: flex; flex-direction: column; gap: 3px; max-width: 108ch;
  }
  .qa .eyebrow { color: var(--teal); }
  .qa p { font-size: 14px; color: var(--ink); }
  .tile .qa-dot { color: var(--teal); }

  /* ---------- narrow ---------- */
  @media (max-width: 1400px) {
    .app { grid-template-columns: 1fr; gap: 20px; }
    .rail { position: static; }
    .railnav { flex-direction: row; flex-wrap: wrap; }
    .railnav button { border-left: 0; border-bottom: 3px solid transparent; padding: 6px 10px; }
    .railnav button.on { border-bottom-color: var(--teal); }
    .detail {
      position: fixed; inset: 0; z-index: 60; max-height: none; height: 100%;
      border: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
    }
    .detail[hidden] { display: none; }
    .d-close {
      display: block; all: unset; cursor: pointer; align-self: flex-start;
      font-family: var(--mono); font-size: 12px; color: var(--teal);
      border: 1px solid var(--teal); padding: 4px 10px;
    }
  }
  @media (max-width: 560px) {
    .statusbar-in { padding-inline: 16px; }
    .app { padding-inline: 16px; }
    .rules { margin-left: 0; }
    .detail { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<div class="app">
  <aside class="rail">
    <input class="search" id="search" type="search" placeholder="filter: hash, window, NULL, O(1)..." autocomplete="off">
    <nav class="railnav" id="railnav"></nav>
    <p class="railfoot">
      Each card lists the problems that fall to the same move, so one card covers a family rather
      than one question.
    </p>
  </aside>

  <main class="board" id="board"></main>

  <article class="detail" id="detail" aria-live="polite"></article>
</div>

<footer class="statusbar">
  <div class="statusbar-in">
    <h1>Pattern Deck</h1>
    <span class="meta">47 cards &middot; algorithms, Python, SQL</span>
    <div class="rules">
      <div class="rule-item"><b>1</b><span>Ask about constraints and bad input first</span></div>
      <div class="rule-item"><b>2</b><span>Write the asserts before the code</span></div>
      <div class="rule-item"><b>3</b><span>Name the slow solution, then beat it</span></div>
    </div>
  </div>
</footer>

<script>
(function () {
  "use strict";

  const FAMILIES = [
    {
      id: "hashing",
      name: "Arrays & Hashing",
      why: "Half of all screening questions. The move is always the same: trade O(n) memory for O(1) lookup, and say that trade out loud.",
      items: [
        {
          id: "contains-duplicate",
          title: "Contains Duplicate",
          lc: "LC 217",
          diff: "Easy",
          cue: "Has anything here been seen before?",
          time: "O(n)",
          space: "O(n)",
          code: [
            ["def contains_duplicate_set(nums):", ""],
            ["    seen = set()", "A set, not a list. `in` on a list is O(n) and would put you back at O(n²)."],
            ["    for num in nums:", ""],
            ["        if num in seen:", "Average O(1): hash the value, jump to the bucket. No scan."],
            ["            return True", "Return on the first hit. No reason to finish the array."],
            ["        seen.add(num)", "Add after the check, never before, or every element matches itself."],
            ["    return False", ""]
          ],
          say: [
            "Three approaches are worth comparing, because the point of the exercise is knowing why the last one wins.",
            "Nested loops compare every pair. That is correct and quadratic, and it is the version to name and then move past.",
            "Sorting puts equal values next to each other, so a single pass finds them. The cost is that the input has been copied or reordered.",
            ["The third is the one to write. Keep a set of the values already seen. A set lookup is constant time on average, so the whole thing is one pass.", ["seen = set()", "if num in seen"]],
            ["The order of these two lines is what matters. Check first, then add. Add first and every element matches itself.", ["seen.add(num)"]],
            "One assumption to state: the values have to be hashable. If they might be lists, the set version breaks and the sorting version still works."
          ],
          edges: [
            ["assert contains_duplicate_set([]) is False", "No duplicates in nothing."],
            ["assert contains_duplicate_set([1]) is False", "One element, nothing to compare against."],
            ["assert contains_duplicate_set([1, 1]) is True", "The minimum true case. If this fails, the add/check order is wrong."],
            ["assert contains_duplicate_set([1, 2, 1]) is True", "Non-adjacent — catches a scan that only compares neighbours."],
            ["assert contains_duplicate_set([1.0, 1]) is True", "Python hashes these equal. Is that what the caller wants?"],
            ["a stream too big for memory", "Linear extra memory is the cost. A Bloom filter or a sort instead."]
          ]
        },
        {
          id: "two-sum",
          title: "Two Sum",
          lc: "LC 1",
          diff: "Easy",
          cue: "Find the pair that hits a target — return indices, not values.",
          time: "O(n)",
          space: "O(n)",
          code: [
            ["def two_sum(nums, target):", ""],
            ["    seen = {}", "Dict, not set: the answer is indices, so you must store value → index."],
            ["    for i, num in enumerate(nums):", "enumerate gives the index for free. Never `range(len(nums))` here."],
            ["        complement = target - num", "The one idea in the problem: don't search for a pair, search for the one partner this number needs."],
            ["        if complement in seen:", "O(1). This is the line that turns O(n²) into O(n)."],
            ["            return [seen[complement], i]", "Earlier index first. seen[complement] was stored on a previous turn."],
            ["        seen[num] = i", "Store after the check, so an element cannot pair with itself."],
            ["    return []", "Outside the loop. Inside it, the function returns on the first iteration."]
          ],
          say: [
            "Three things to settle before writing anything. Is exactly one answer guaranteed? May the same element be used twice? Can the values be negative? Each one changes the code.",
            "Brute force is two nested loops, which is quadratic. A one-pass version exists.",
            ["The reframe is the key step. Instead of asking which two numbers add up to the target, ask of each number whether the partner it needs has already appeared. A pair search becomes a lookup.", ["complement = target - num", "if complement in seen"]],
            ["A dict rather than a set, because the task asks for indices and not values.", ["seen = {}", "return [seen[complement], i]"]],
            ["The same ordering detail: look up before storing. Store first, and a single element pairs with itself as soon as the target is double its value.", ["seen[num] = i"]],
            "Negatives and zero need no special handling here, which is an advantage over any version that starts by sorting."
          ],
          edges: [
            ["assert two_sum([], 0) == []", "The loop body never runs."],
            ["assert two_sum([3], 6) == []", "One element cannot pair with itself, even at half the target."],
            ["assert two_sum([3, 3], 6) == [0, 1]", "Duplicates that are the answer. Checking before inserting is what makes this work."],
            ["assert two_sum([0, 4, 0], 0) == [0, 2]", "Zeroes and a zero target — where a truthiness check instead of `in` would break."],
            ["assert two_sum([1, 2, 3], 100) == []", "No answer exists. Confirm the contract: empty list, None, or raise?"]
          ]
        },
        {
          id: "valid-anagram",
          title: "Valid Anagram",
          lc: "LC 242",
          diff: "Easy",
          cue: "Same letters, same counts, order irrelevant.",
          time: "O(n)",
          space: "O(k) for the alphabet",
          code: [
            ["def is_anagram_dict(s, t):", ""],
            ["    if len(s) != len(t):", "The cheap rejection first. O(1), and it removes a whole class of input."],
            ["        return False", ""],
            ["    counts = {}", ""],
            ["    for ch in s:", ""],
            ["        counts[ch] = counts.get(ch, 0) + 1", ".get with a default avoids KeyError without a separate `if ch in counts`."],
            ["    for ch in t:", "One dict, counted up then down — not two dicts compared."],
            ["        counts[ch] = counts.get(ch, 0) - 1", ""],
            ["        if counts[ch] < 0:", "Going negative means t has a letter s did not, or has too many of it."],
            ["            return False", "Early exit. With equal lengths, no negative count implies all counts are zero."],
            ["    return True", ""]
          ],
          say: [
            "Two spec questions first: does case matter, and is whitespace significant? Listen and Silent are anagrams only if the answer to both is no. That is a spec decision, not a coding one.",
            "In real code Counter(s) == Counter(t) is the whole solution. Counting by hand here shows how it works.",
            ["The length check is not an optimisation. It is what makes everything after it sound: if the lengths match and no count ever goes negative, then every count must be zero.", ["if len(s) != len(t)"]],
            ["One dictionary rather than two: count up through the first string and down through the second.", ["counts.get(ch, 0) + 1", "counts.get(ch, 0) - 1"]],
            ["As soon as a count drops below zero the answer is no. It means t has a letter s did not, or too many of it.", ["if counts[ch] < 0"]],
            "Linear time. Space is the size of the alphabet, so 26 for lowercase ASCII and effectively constant, though not for Unicode."

  const GROUPS = {
    patterns: "Algorithm patterns",
    theory: "Python & QA theory",
    sql: "SQL"
  };

  const ALL = [];
  FAMILIES.forEach(function (fam) {
    fam.group = fam.group || "patterns";
    fam.items.forEach(function (item) {
      item.family = fam.name;
      item.famId = fam.id;
      item.group = fam.group;
      const a = ALSO[item.id];
      if (a) { item.alsoNote = a[0]; item.also = a[1]; }
      item.tests = TESTS[item.id] || null;
      ALL.push(item);
    });
  });

  // "219 Contains Duplicate II" -> a bold number plus the name, all of them in
  // one comma-separated run rather than a stacked list.
  // Built from char codes, not written literally: a bare non-breaking space
  // in the source is invisible and is the first thing an encoding accident
  // turns into mojibake.
  const NBSP = String.fromCharCode(160);
  const ENDASH = String.fromCharCode(8211);

  function refRun(cls, refs) {
    const p = document.createElement("p");
    p.className = cls;
    refs.forEach(function (ref, i) {
      const cut = ref.indexOf(" ");
      if (i) p.appendChild(document.createTextNode(", "));
      const num = document.createElement("b");
      num.textContent = ref.slice(0, cut);
      p.appendChild(num);
      p.appendChild(document.createTextNode(NBSP + ref.slice(cut + 1)));
    });
    return p;
  }

  const board = document.getElementById("board");
  const railnav = document.getElementById("railnav");
  const detail = document.getElementById("detail");
  const search = document.getElementById("search");

  let selected = "contains-duplicate";

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function diffClass(item) {
    if (item.diff === "Note") return "note";
    return item.diff.toLowerCase();
  }

  /* ---------- rail ---------- */
  let railGroup = null;
  FAMILIES.forEach(function (fam) {
    if (fam.group !== railGroup) {
      railGroup = fam.group;
      const g = el("p", "railgroup" + (railnav.childNodes.length ? "" : " first"), GROUPS[fam.group]);
      railnav.appendChild(g);
    }
    const b = el("button", "", "");
    b.appendChild(el("span", "", fam.name));
    b.appendChild(el("span", "c", String(fam.items.length)));
    b.addEventListener("click", function () {
      const target = document.getElementById("fam-" + fam.id);
      if (!target) return;
      target.scrollIntoView({ behavior: "smooth", block: "start" });
      // Picking a topic opens its first card, so the detail pane is never
      // showing something from a family you have just navigated away from.
      const first = target.querySelector(".tile");
      if (first) select(first.dataset.id, false);
    });
    b.dataset.fam = fam.id;
    railnav.appendChild(b);
  });

  /* ---------- tiles ---------- */
  function buildBoard() {
    board.textContent = "";
    const q = search.value.trim().toLowerCase();
    let shown = 0;

    FAMILIES.forEach(function (fam) {
      const matches = fam.items.filter(function (item) {
        if (!q) return true;
        const hay = [item.title, item.cue, item.lc, fam.name, item.time || ""]
          .concat(item.also || []).join(" ").toLowerCase();
        return hay.indexOf(q) !== -1;
      });
      if (!matches.length) return;
      shown += matches.length;

      const sec = el("section", "fam");
      sec.id = "fam-" + fam.id;
      const head = el("div", "fam-head");
      head.appendChild(el("h2", "", fam.name));
      head.appendChild(el("p", "", fam.why));
      sec.appendChild(head);

      const grid = el("div", "tiles");
      matches.forEach(function (item) {
        const tile = el("button", "tile " + diffClass(item));
        tile.type = "button";
        tile.dataset.id = item.id;
        if (item.id === selected) tile.classList.add("on");

        const top = el("div", "tile-top");
        top.appendChild(el("b", "", item.title));
        top.appendChild(el("span", "lc", item.lc));
        tile.appendChild(top);
        tile.appendChild(el("p", "cue", item.cue));

        if (item.also) tile.appendChild(refRun("tile-also", item.also));

        tile.addEventListener("click", function () { select(item.id); });
        grid.appendChild(tile);
      });
      sec.appendChild(grid);
      board.appendChild(sec);
    });

    if (!shown) {
      board.appendChild(el("p", "empty", "Nothing matches that. Clear the filter to see all 47 cards."));
      return;
    }
    // If the filter hid whatever was open, show the first card that survived
    // rather than leaving the detail pane on something no longer in the grid.
    if (!board.querySelector(".tile.on")) {
      const first = board.querySelector(".tile");
      if (first) select(first.dataset.id, false);
    }
  }

  /* ---------- detail ---------- */
  function buildDetail(item) {
    detail.textContent = "";
    const codeRows = [];
    // The script reads first, the snippet sits under it. Both are still built
    // in the old order - the say steps need codeRows filled to find their
    // lines - so these hold the sections until there is somewhere to put them.
    let codeSec = null;
    let tableSec = null;

    const close = el("button", "d-close", "← back to the deck");
    close.type = "button";
    close.addEventListener("click", function () { detail.hidden = true; });
    detail.appendChild(close);

    const head = el("div", "d-head");
    head.appendChild(el("p", "eyebrow", item.family));

    const titleRow = el("div", "d-title");
    titleRow.appendChild(el("h2", "", item.title));
    const meta = el("div", "d-meta");
    if (item.time) meta.appendChild(el("span", "chip", "time " + item.time));
    if (item.space) meta.appendChild(el("span", "chip", "space " + item.space));
    if (meta.childNodes.length) titleRow.appendChild(meta);
    head.appendChild(titleRow);

    head.appendChild(el("p", "d-cue", item.cue));
    detail.appendChild(head);

    if (item.qa) {
      const qa = el("div", "qa");
      qa.appendChild(el("p", "eyebrow", "Where it bites in a test suite"));
      qa.appendChild(el("p", "", item.qa));
      detail.appendChild(qa);
    }

    if (item.code) {
      const sec = el("section", "sec");
      const box = el("div", "code");
      let n = 0;
      item.code.forEach(function (pair) {
        const line = el("div", "ln");
        const blank = !pair[0];
        if (!blank) n += 1;
        if (pair[1]) line.classList.add("has-note");
        line.appendChild(el("span", "num", blank ? "" : String(n)));
        line.appendChild(el("span", "src", pair[0] || NBSP));
        if (pair[1]) line.appendChild(el("span", "note", pair[1]));
        box.appendChild(line);
        if (!blank) codeRows.push({ n: n, src: pair[0], node: line });
      });
      sec.appendChild(box);
      codeSec = sec;
    }

    if (item.table) {
      const sec = el("section", "sec");
      sec.appendChild(el("p", "eyebrow", item.tableLabel || "Costs to have ready"));
      const wrap = el("div", "tbl-wrap");
      const t = el("table", "tbl");
      const thead = el("thead");
      const hr = el("tr");
      item.table.head.forEach(function (h) { hr.appendChild(el("th", "", h)); });
      thead.appendChild(hr);
      t.appendChild(thead);
      const tb = el("tbody");
      item.table.rows.forEach(function (row) {
        const tr = el("tr");
        row.forEach(function (cell) { tr.appendChild(el("td", "", cell)); });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      wrap.appendChild(t);
      sec.appendChild(wrap);
      tableSec = sec;
    }

    const sayS = el("section", "sec");
    sayS.appendChild(el("p", "eyebrow",
      item.kind === "theory" ? "Answer in this order"
        : item.kind === "sql" ? "Say this while you write"
        : "Say this"));
    const script = el("div", "script");

    function clearHot() {
      codeRows.forEach(function (r) { r.node.classList.remove("hot"); });
    }
    function showHot(rows, scroll) {
      clearHot();
      rows.forEach(function (r) { r.node.classList.add("hot"); });
      // Only a click or a keyboard focus scrolls. The snippet sits below the
      // script now, so scrolling on hover would drag the step out from under
      // the pointer and immediately un-hover it.
      if (scroll && rows.length) rows[0].node.scrollIntoView({ block: "nearest" });
    }

    item.say.forEach(function (entry, i) {
      // A step is either plain text, or [text, ["fragment of a code line", ...]].
      // Matching by fragment rather than by line number: the mapping survives
      // an edit to the snippet, and a fragment that stops matching simply
      // renders as an ordinary step instead of pointing at the wrong line.
      const text = Array.isArray(entry) ? entry[0] : entry;
      const keys = Array.isArray(entry) ? (entry[1] || []) : [];
      const rows = keys.length
        ? codeRows.filter(function (r) {
            return keys.some(function (k) { return r.src.indexOf(k) !== -1; });
          })
        : [];

      const row = el("div");
      row.appendChild(el("span", "q", String(i + 1).padStart(2, "0")));
      const body = el("span", "");
      body.appendChild(document.createTextNode(text));

      if (rows.length) {
        const lo = rows[0].n;
        const hi = rows[rows.length - 1].n;
        body.appendChild(el("span", "lineref", lo === hi ? "L" + lo : "L" + lo + ENDASH + hi));
        row.classList.add("linked");
        row.tabIndex = 0;
        row.addEventListener("mouseenter", function () { showHot(rows, false); });
        row.addEventListener("mouseleave", function () {
          if (!row.classList.contains("pinned")) clearHot();
        });
        row.addEventListener("focus", function () { showHot(rows, true); });
        row.addEventListener("click", function () {
          const on = row.classList.contains("pinned");
          Array.prototype.forEach.call(script.children, function (c) { c.classList.remove("pinned"); });
          if (on) { clearHot(); } else { row.classList.add("pinned"); showHot(rows, true); }
        });
        row.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); row.click(); }
        });
      }

      row.appendChild(body);
      script.appendChild(row);
    });
    sayS.appendChild(script);
    detail.appendChild(sayS);

    if (codeSec) detail.appendChild(codeSec);
    if (tableSec) detail.appendChild(tableSec);

    const edgeS = el("section", "sec");
    edgeS.appendChild(el("p", "eyebrow",
      item.kind === "theory" ? "Follow-ups they will ask"
        : item.kind === "sql" ? "Traps and follow-ups"
        : "Edge cases to raise first, and the assert for each"));
    const edges = el("div", "edges");
    item.edges.forEach(function (pair) {
      const row = el("div");
      // A row whose left half is runnable gets code treatment; the ones that
      // cannot be a one-liner - a ragged board, a stream too big for memory -
      // stay as prose and are covered by the module below.
      const runnable = pair[0].indexOf("assert ") === 0 && pair[0].indexOf("(") !== -1;
      row.appendChild(el("b", runnable ? "runnable" : "", pair[0]));
      row.appendChild(el("span", "", pair[1]));
      edges.appendChild(row);
    });
    edgeS.appendChild(edges);

    if (item.tests) {
      const det = document.createElement("details");
      det.className = "testdetails";
      const sum = document.createElement("summary");
      sum.textContent = item.kind === "theory"
        ? "the fixtures, and the tests that request them"
        : "the whole thing as a test module";
      det.appendChild(sum);
      det.appendChild(el("pre", "testblock", item.tests.join("\n")));
      edgeS.appendChild(det);
    }

    detail.appendChild(edgeS);

    if (item.also) {
      const sec = el("section", "sec");
      sec.appendChild(el("p", "eyebrow", "Same shape, other problems"));
      if (item.alsoNote) sec.appendChild(el("p", "also-note", item.alsoNote));
      sec.appendChild(refRun("also", item.also));
      detail.appendChild(sec);
    }

    detail.scrollTop = 0;
  }

  function select(id, openDrawer) {
    selected = id;
    const item = ALL.filter(function (x) { return x.id === id; })[0];
    if (!item) return;
    buildDetail(item);
    Array.prototype.forEach.call(document.querySelectorAll(".tile"), function (t) {
      t.classList.toggle("on", t.dataset.id === id);
    });
    Array.prototype.forEach.call(railnav.querySelectorAll("button"), function (b) {
      b.classList.toggle("on", b.dataset.fam === item.famId);
    });
    if (openDrawer !== false && window.matchMedia("(max-width: 1400px)").matches) {
      detail.hidden = false;
    }
  }

  /* ---------- wiring ---------- */
  search.addEventListener("input", buildBoard);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !detail.hidden) {
      if (window.matchMedia("(max-width: 1400px)").matches) detail.hidden = true;
    }
  });

  buildBoard();
  select(selected);
})();
</script>
