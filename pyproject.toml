[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dns", email = "salnikovden@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.5.0",
    "chromadb>=1.5.9",
    "ollama>=0.6.2",
    "pypdf>=6.18.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
llm-eval-harness = "llm_eval_harness:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.ruff]
src = ["src", "practice", "tests"]

[tool.pytest.ini_options]
# Only the harness runs by default. practice/ is interview drill code - it hits
# the network and is allowed to sit red while a task is in progress, so it must
# not decide whether the project is green. Run it on purpose:
#     uv run pytest practice
testpaths = ["tests"]
pythonpath = ["src"]
