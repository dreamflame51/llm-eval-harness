[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dns", email = "salnikovden@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.2.3",
    "diskcache>=5.6.3",
    "langchain-community<0.4",
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.2",
    "openai>=3.14.0",
    "pypdf>=6.18.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.2",
    "ragas<0.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "transformers>=5.17.0",
]

[project.optional-dependencies]
# Tracing is an extra, not a dependency: CI installs the base set and every
# reported number is computed without it. Turn it on for a run with
#     uv sync --extra trace
trace = [
    "langfuse>=3.0.0",
]

[project.scripts]
llm-eval-harness = "llm_eval_harness:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ is importable because label_refusals.py edits the frozen answers
# file in place, and that is worth a test rather than a careful hand.
pythonpath = ["src", "scripts"]
# Registered rather than left to a warning, and deliberately not excluded by
# default: `uv run pytest` runs everything, `-m "not slow"` is for the edit
# loop. A slow check that is skipped by default is a check that stops running.
markers = [
    "slow: re-parses the corpus PDFs; about 100s of the suite's 160",
]
