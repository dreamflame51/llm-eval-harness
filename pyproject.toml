[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dns", email = "salnikovden@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.5.0",
    "chromadb>=1.5.9",
    "deepeval>=4.2.3",
    "langchain-community<0.4",
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.2",
    "pypdf>=6.18.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.2",
    "ragas<0.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
llm-eval-harness = "llm_eval_harness:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.ruff]
src = ["src", "practice", "tests"]

[tool.pytest.ini_options]
# Only the harness runs by default. practice/ is interview drill code - it hits
# the network and is allowed to sit red while a task is in progress, so it must
# not decide whether the project is green. Run it on purpose:
#     uv run pytest practice
testpaths = ["tests"]
# scripts/ is importable because label_refusals.py edits the frozen answers
# file in place, and that is worth a test rather than a careful hand.
pythonpath = ["src", "scripts"]
# Registered rather than left to a warning, and deliberately not excluded by
# default: `uv run pytest` runs everything, `-m "not slow"` is for the edit
# loop. A slow check that is skipped by default is a check that stops running.
markers = [
    "slow: re-parses the corpus PDFs; about 100s of the suite's 160",
]
